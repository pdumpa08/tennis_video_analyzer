<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Processing App</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:400,400i,700,700i,600,600i&amp;display=swap">
    <link rel="stylesheet" href="assets/css/baguetteBox.min.css">
    <link rel="stylesheet" href="assets/css/vanilla-zoom.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        input[type="file"] {
            padding: 10px;
            margin: 10px;
        }
        #processedVideo {
            margin-top: 20px;
            max-width: 100%;
            height: auto;
        }
        .loading {
            font-size: 20px;
            color: #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top bg-body clean-navbar">
    <div class="container"><a class="navbar-brand logo" href="#" style="margin: auto;">Tennis Analyzer</a></div>
</nav>

<main class="page">
<div class="container">
    
    <section class="clean-block clean-hero" style="background-image: url(&quot;assets/img/tech/1200px-2013_Australian_Open_-_Guillaume_Rufin.jpg&quot;);color: rgba(9, 162, 255, 0.85);">
        <div class="text">
            <h2>Analyze File</h2>
            <p>Analyze your tennis clips with ease.</p>
            <form id="videoForm" enctype="multipart/form-data">
                <input type="file" id="fileInput" name="video" accept="video/*" required>
                <button type="submit">Upload & Process Video</button>
            </form>        
        </div>
    </section>
    
    <div id="loadingMessage" class="loading" style="display:none;">
        Processing your video... Please wait.
    </div>

    <video id="processedVideo" controls style="display:none; margin-top: 20px;">
        <source src="" type="video/avi">
        Your browser does not support the video tag.
    </video>
</div>
</main>

<script>
    const form = document.getElementById("videoForm");
    const fileInput = document.getElementById("fileInput");
    const loadingMessage = document.getElementById("loadingMessage");
    const processedVideo = document.getElementById("processedVideo");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        // Display the loading message
        loadingMessage.style.display = "block";
        processedVideo.style.display = "none";

        const formData = new FormData();
        formData.append("video", fileInput.files[0]);

        fetch("/process-video", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Hide the loading message and display the processed video
                loadingMessage.style.display = "none";
                processedVideo.style.display = "block";
                processedVideo.src = data.video_url; // Set the src to the returned video URL
            } else {
                alert("Error: " + data.message);
                loadingMessage.style.display = "none";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("An error occurred while processing the video.");
            loadingMessage.style.display = "none";
        });
    });
</script>

<script src="assets/bootstrap/js/bootstrap.min.js"></script>
<script src="assets/js/baguetteBox.min.js"></script>
<script src="assets/js/vanilla-zoom.js"></script>
<script src="assets/js/theme.js"></script>

</body>
</html>
